# Downloads native-speaker recordings from Lingua Libre (Wikimedia Commons) into audio/,
# commits them to main and republishes the website. Run it from the Actions tab
# ("Fetch native audio" → Run workflow). Safe to run again: existing recordings are kept.
name: Fetch native audio

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of words to look up in this run
        required: false
        default: '2000'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Download recordings
        run: node tools/fetch-audio.js --limit "${{ github.event.inputs.limit }}"
      - name: Commit new recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "No new recordings."
          else
            git commit -m "Add native-speaker recordings from Lingua Libre"
            git push
          fi
      - name: Check course content
        run: node tools/validate.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
