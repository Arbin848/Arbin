# Generates a recording for every Polish text that has no native recording, using Piper
# (free, offline neural speech), checks each clip with an offline speech recognizer (Vosk),
# commits the MP3s and republishes the website. Run from the Actions tab: "Generate speech".
name: Generate speech

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg unzip
          pip install -q piper-tts vosk
      - name: Download Polish voices and the speech recognizer
        run: |
          mkdir -p voices
          python -m piper.download_voices pl_PL-gosia-medium pl_PL-darkman-medium --download-dir voices
          curl -fsSL -o vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-pl-0.22.zip \
            && unzip -q vosk.zip -d vosk && mv vosk/* vosk-model \
            || echo "Speech recognizer not available; the quality check will be skipped."
      - name: List every text
        run: node tools/list-texts.js > texts.json && python -c "import json;print(len(json.load(open('texts.json'))),'texts')"
      - name: Generate speech
        run: python tools/gen-speech.py texts.json voices
      - name: Check quality
        # A failed check never blocks publishing the recordings.
        continue-on-error: true
        run: python tools/check-speech.py vosk-model voices
      - name: Voice credits
        run: |
          python - <<'EOF'
          import json
          lines = ['# Generated voices', '', 'Generated with [Piper](https://github.com/OHF-Voice/piper1-gpl) (offline neural text-to-speech).', '']
          for v in ['pl_PL-gosia-medium', 'pl_PL-darkman-medium']:
              cfg = json.load(open(f'voices/{v}.onnx.json'))
              ds = cfg.get('dataset', '?')
              lines.append(f'- **{v}**: dataset {ds}. Voice model from [rhasspy/piper-voices](https://huggingface.co/rhasspy/piper-voices); see its model card for the licence.')
          open('audio/tts/VOICES.md', 'w').write('\n'.join(lines) + '\n')
          EOF
      - name: Commit recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tts audio/tts.js
          if git diff --cached --quiet; then echo "Nothing new."; else
            git commit -m "Add generated speech for every text without a native recording"
            git pull --rebase -q origin main
            git push
          fi
      - name: Check course content
        run: node tools/validate.js
      - name: Remove tools before publishing
        run: rm -rf voices vosk vosk-model vosk.zip texts.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
