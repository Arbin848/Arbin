<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Słówka</title>
<meta name="description" content="Learn Polish vocabulary with flashcards, quizzes, typing practice and a pronunciation guide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <h1 lang="pl">S<span class="dia">ł</span><span class="dia">ó</span>wka</h1>
      <p>Polish vocabulary, a few minutes a day.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Practice mode">
    <button class="tab" role="tab" data-action="mode" data-mode="cards">Flashcards</button>
    <button class="tab" role="tab" data-action="mode" data-mode="quiz">Quiz</button>
    <button class="tab" role="tab" data-action="mode" data-mode="type">Type it</button>
    <button class="tab" role="tab" data-action="mode" data-mode="sounds">Sounds</button>
  </nav>

  <section class="controls" id="controls" aria-label="Topic">
    <div class="chips" id="chips"></div>
    <button class="dir" id="dir" data-action="dir"></button>
  </section>

  <section class="stage" id="stage" aria-live="polite"></section>

  <footer class="foot">
    <span>Progress is saved in this browser. Listening uses your device's Polish voice if it has one.</span>
    <button class="link-btn" data-action="reset">Reset progress</button>
  </footer>
</main>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
